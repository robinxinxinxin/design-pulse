    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* === BrandPulse Design System === */
        :root {
            --bg-primary: #0f1419;
            --bg-secondary: #1a1f2e;
            --bg-card: #1e2530;
            --bg-card-hover: #252d3a;
            --bg-input: #1e2530;
            --text-primary: #e6e6e6;
            --text-secondary: #8b949e;
            --text-muted: #6b7280;
            --accent-cyan: #22d3ee;
            --accent-cyan-dark: #06b6d4;
            --accent-green: #22c55e;
            --accent-gold: #fbbf24;
            --accent-blue: #3b82f6;
            --accent-purple: #a855f7;
            --accent-pink: #ec4899;
            --accent-red: #ef4444;
            --accent-orange: #f97316;
            --border-color: rgba(255,255,255,0.06);
            --border-hover: rgba(255,255,255,0.1);
            --font-body: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --transition: 0.2s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
        :focus-visible { outline: 2px solid var(--accent-cyan); outline-offset: 2px; }

        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* === HEADER === */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 1.25rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
        }

        .header-left { display: flex; align-items: center; gap: 1rem; }
        .logo {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-cyan-dark));
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 13px;
            color: var(--bg-primary);
            letter-spacing: -0.5px;
        }
        .header h1 { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.3px; }
        .header h1 span { color: var(--text-muted); font-weight: 400; margin-left: 0.5rem; font-size: 0.85rem; }
        .header-right { display: flex; align-items: center; gap: 0.75rem; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-green); animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .last-update { font-size: 0.8rem; color: var(--text-muted); }

        /* === LAYOUT === */
        .container { max-width: 900px; margin: 0 auto; padding: 1.5rem 2rem 3rem; }

        /* === FILTER BAR === */
        .filter-bar {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .filter-tab {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-secondary);
            transition: var(--transition);
        }

        .filter-tab:hover { color: var(--text-primary); background: var(--bg-card); }
        .filter-tab.active { color: var(--accent-cyan); background: rgba(34, 211, 238, 0.1); border-color: rgba(34, 211, 238, 0.3); }

        .filter-spacer { flex: 1; }

        .search-box {
            position: relative;
            min-width: 200px;
            max-width: 280px;
        }

        .search-box svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }

        .search-box input {
            width: 100%;
            padding: 0.5rem 0.75rem 0.5rem 2.25rem;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.85rem;
            font-family: var(--font-body);
            transition: var(--transition);
            outline: none;
        }

        .search-box input::placeholder { color: var(--text-muted); }
        .search-box input:focus { border-color: var(--accent-cyan); box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.15); }

        /* === TIMELINE === */
        .timeline { position: relative; }

        .timeline::before {
            content: '';
            position: absolute;
            left: 60px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--border-color);
        }

        .timeline-item {
            display: flex;
            gap: 1.25rem;
            margin-bottom: 1rem;
            position: relative;
        }

        .timeline-time {
            width: 60px;
            flex-shrink: 0;
            text-align: right;
            padding-right: 1.25rem;
            position: relative;
        }

        .timeline-time::after {
            content: '';
            position: absolute;
            right: -5px;
            top: 6px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border-hover);
            border: 2px solid var(--bg-primary);
        }

        .timeline-item.new .timeline-time::after {
            background: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.2);
        }

        .time-date { font-size: 0.75rem; color: var(--text-muted); font-weight: 500; }
        .time-day { font-size: 0.85rem; color: var(--text-secondary); font-weight: 600; }

        .timeline-content {
            flex: 1;
            min-width: 0;
        }

        /* === CARD === */
        .card {
            background: var(--bg-card);
            border: 1px solid transparent;
            border-radius: 12px;
            padding: 16px 20px;
            transition: all 0.2s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .card:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
            transform: translateY(-1px);
        }

        .card-header {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 0.6rem;
        }

        .card-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 12px;
            color: var(--bg-primary);
            flex-shrink: 0;
        }

        /* BrandPulse 头像渐变色 */
        .avatar-c0 { background: linear-gradient(135deg, #ff6b6b, #ee5a24); }
        .avatar-c1 { background: linear-gradient(135deg, #a29bfe, #6c5ce7); }
        .avatar-c2 { background: linear-gradient(135deg, #55efc4, #00b894); }
        .avatar-c3 { background: linear-gradient(135deg, #fdcb6e, #f39c12); }
        .avatar-c4 { background: linear-gradient(135deg, #74b9ff, #0984e3); }
        .avatar-c5 { background: linear-gradient(135deg, #fd79a8, #e84393); }

        .card-meta {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-author { font-size: 0.85rem; font-weight: 600; color: var(--text-primary); }
        .card-platform {
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: 500;
            text-transform: uppercase;
        }
        .platform-zcool { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); }
        .platform-puxiang { background: rgba(34, 197, 94, 0.15); color: var(--accent-green); }
        .platform-behance { background: rgba(59, 130, 246, 0.15); color: var(--accent-blue); }

        .card-title {
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-primary);
            line-height: 1.5;
            margin-bottom: 0.4rem;
        }

        .card-desc {
            font-size: 0.82rem;
            color: var(--text-secondary);
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-footer {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid var(--border-color);
        }

        .card-tag {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .card-tag svg { width: 14px; height: 14px; }

        .card-link {
            margin-left: auto;
            font-size: 0.8rem;
            color: var(--accent-cyan);
            display: flex;
            align-items: center;
            gap: 0.2rem;
        }

        .card:hover .card-link { color: #67e8f9; }

        /* === WEEK SECTION === */
        .week-section { margin-bottom: 2rem; }
        .week-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
            padding-left: 84px;
        }

        .week-badge {
            padding: 0.35rem 0.75rem;
            background: rgba(34, 211, 238, 0.1);
            border: 1px solid rgba(34, 211, 238, 0.2);
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--accent-cyan);
        }

        .week-count {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* === EMPTY STATE === */
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }
        .empty-state svg { width: 48px; height: 48px; margin-bottom: 1rem; opacity: 0.3; }
        .empty-state p { font-size: 0.95rem; }

        /* === FOOTER === */
        .footer {
            margin-top: 3rem;
            padding: 2rem 0;
            border-top: 1px solid var(--border-color);
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
        .footer a { color: var(--accent-cyan); text-decoration: none; }
        .footer a:hover { text-decoration: underline; }

        /* === RESPONSIVE === */
        @media (max-width: 768px) {
            .container { padding: 1rem; }
            .header { padding: 1rem; }
            .header h1 span { display: none; }
            .filter-bar { gap: 0.5rem; }
            .search-box { max-width: none; flex-basis: 100%; order: -1; margin-bottom: 0.5rem; }
            .timeline::before { left: 50px; }
            .timeline-time { width: 50px; padding-right: 1rem; }
            .week-header { padding-left: 74px; }
            .card { padding: 14px 16px; }
        }
    </style>
</head>

                { name: "Thais Katsumi", profile_url: "https://www.behance.net/thaiskatsumi", notes: "3D设计师，3409好评，1161关注者，5.1万项目查看，Behance推荐", platform: "behance" },
                { name: "Danil Repko", profile_url: "https://www.behance.net/danilrepko", notes: "家具设计师，1388好评，506关注者，1.5万项目查看，代表作ALMA Vanity Set", platform: "behance" },
                { name: "Kenneth Perez", profile_url: "https://www.behance.net/kennethperez", notes: "家具设计师，1143好评，343关注者，9.7万项目查看，代表作Biedermeier Pool Table", platform: "behance" },

                { name: "Esraa Ashraf", profile_url: "https://www.behance.net/esraaashraf", notes: "室内设计师，737好评，468关注者，1万项目查看，Behance推荐", platform: "behance" },

                { name: "Alina Libetska", profile_url: "https://www.behance.net/alinalibetska", notes: "建筑可视化设计师，685好评，168关注者，1.1万项目查看，Behance推荐", platform: "behance" },
                { name: "M N E", profile_url: "https://www.behance.net/mne", notes: "室内设计师，3476好评，1380关注者，5.6万项目查看，Behance推荐", platform: "behance" },
                { name: "Vashantsev Nik", profile_url: "https://www.behance.net/vashantsevnik", notes: "室内设计师，2149好评，524关注者，3万项目查看，Behance推荐", platform: "behance" },
                { name: "Ucha Tsibadze", profile_url: "https://www.behance.net/uchatsibadze", notes: "室内设计师，678好评，119关注者，1.3万项目查看，Behance推荐", platform: "behance" },
                { name: "mariem fawzi", profile_url: "https://www.behance.net/mariemfawzi", notes: "室内设计师，255好评，75关注者，2613项目查看，Behance推荐", platform: "behance" },
                { name: "Anna Krupkin", profile_url: "https://www.behance.net/annakrupkin", notes: "插画家，1900好评，163关注者，1.5万项目查看，Behance推荐", platform: "behance" },
                { name: "Alexandru Negru", profile_url: "https://www.behance.net/alexandrunegru", notes: "3D产品可视化师，6096好评，804关注者，7.5万项目查看，Behance推荐", platform: "behance" },
                { name: "Oleksandr Honcharuk", profile_url: "https://www.behance.net/oleksandrhoncharuk", notes: "3D动画师，6362好评，612关注者，5.3万项目查看，Behance推荐", platform: "behance" },
                { name: "David Adebayo", profile_url: "https://www.behance.net/davidadebayo", notes: "产品设计师，1.4万好评，492关注者，16.3万项目查看，Behance推荐", platform: "behance" },
                { name: "Uladzimir Hermanovich", profile_url: "https://www.behance.net/uladzimirhermanovich", notes: "3D产品动画师，3193好评，661关注者，Behance推荐", platform: "behance" },
                { name: "Sachin Zakarde", profile_url: "https://www.behance.net/sachinzakarde", notes: "工业设计师，Behance工业设计搜索推荐", platform: "behance" }
            ]
        };

        // 模拟本周新作品数据（实际由自动化任务生成）
        const weeklyUpdates = [
            // 示例数据，展示时间线效果
            {
                date: '2026-05-24',
                author: '厂长',
                platform: 'puxiang',
                author_type: 'individual',
                title: '气候自适应智能灌溉系统',
                desc: '基于环境感知的智能灌溉解决方案，可根据土壤湿度、气温、光照自动调节浇水量',
                url: 'https://www.puxiang.com/u100483/gallery',
                isNew: true
            }
        ];

        let allDesigners = [];
        let currentFilter = 'all';

        function init() {
            // 合并数据
            designersData.companies.forEach(d => allDesigners.push({ ...d, type: 'company' }));
            designersData.individuals.forEach(d => allDesigners.push({ ...d, type: 'individual' }));

            // 更新统计
            document.getElementById('footer-count').textContent = allDesigners.length;

            // 渲染时间线
            renderTimeline();

            // 绑定事件
            bindEvents();
        }

        function getInitials(name) { return name.charAt(0).toUpperCase(); }

        function getAvatarColorClass(name) {
            const idx = name.length % 6;
            return `avatar-c${idx}`;
        }

        function getPlatformClass(p) {
            return `platform-${p}`;
        }

        function getPlatformName(p) {
            return { puxiang: '普象', behance: 'Behance', zcool: '站酷' }[p] || p;
        }

        function getTypeLabel(t) {
            return t === 'company' ? '设计公司' : '设计师';
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            const month = date.getMonth() + 1;
            const day = date.getDate();
            const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
            return {
                date: `${month}月${day}日`,
                day: weekdays[date.getDay()]
            };
        }

        function createTimelineItem(item, isNew = false) {
            const time = formatDate(item.date || new Date().toISOString());
            const div = document.createElement('div');
            div.className = `timeline-item ${isNew ? 'new' : ''}`;

            div.innerHTML = `
                <div class="timeline-time">
                    <div class="time-date">${time.date}</div>
                    <div class="time-day">${time.day}</div>
                </div>
                <div class="timeline-content">
                    <a href="${item.url || item.profile_url}" target="_blank" class="card">
                        <div class="card-header">
                            <div class="card-avatar ${getAvatarColorClass(item.author)}">${getInitials(item.author)}</div>
                            <div class="card-meta">
                                <span class="card-author">${escapeHtml(item.author)}</span>
                                <span class="card-platform ${getPlatformClass(item.platform)}">${getPlatformName(item.platform)}</span>
                            </div>
                        </div>
                        <div class="card-title">${escapeHtml(item.title || '发布新作品')}</div>
                        <div class="card-desc">${escapeHtml(item.desc || item.notes)}</div>
                        <div class="card-footer">
                            <span class="card-tag">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                                ${getTypeLabel(item.author_type || item.type)}
                            </span>
                            <span class="card-link">
                                查看作品
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M17 7H7M17 7V17"/></svg>
                            </span>
                        </div>
                    </a>
                </div>
            `;
            return div;
        }

        function createWeekSection(title, items, isNew = false) {
            const section = document.createElement('div');
            section.className = 'week-section';

            const header = document.createElement('div');
            header.className = 'week-header';
            header.innerHTML = `
                <span class="week-badge">${title}</span>
                <span class="week-count">${items.length} 条动态</span>
            `;
            section.appendChild(header);

            const timeline = document.createElement('div');
            timeline.className = 'timeline';
            items.forEach(item => {
                timeline.appendChild(createTimelineItem(item, isNew));
            });
            section.appendChild(timeline);

            return section;
        }

        function renderTimeline() {
            const container = document.getElementById('timeline');
            container.innerHTML = '';

            // 根据筛选条件渲染
            let items = [];

            if (currentFilter === 'this-week') {
                // 本周更新（实际数据由自动化任务填充）
                items = weeklyUpdates;
                if (items.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                            <p>本周暂无新作品</p>
                            <p style="font-size: 0.8rem; margin-top: 0.5rem;">每周一自动更新</p>
                        </div>`;
                    return;
                }
                container.appendChild(createWeekSection('本周更新', items, true));
            } else if (currentFilter === 'all') {
                // 全部设计师（作为基础档案展示）
                // 按平台分组展示
                const puxiangItems = allDesigners.filter(d => d.platform === 'puxiang');
                const behanceItems = allDesigners.filter(d => d.platform === 'behance');

                if (weeklyUpdates.length > 0) {
                    container.appendChild(createWeekSection('本周更新', weeklyUpdates, true));
                }

                // 展示设计师档案
                container.appendChild(createWeekSection('监测中的设计师', allDesigners.slice(0, 10)));
            } else {
                // 按平台筛选
                items = allDesigners.filter(d => d.platform === currentFilter);
                container.appendChild(createWeekSection(getPlatformName(currentFilter), items));
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function bindEvents() {
            // 筛选标签
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentFilter = tab.dataset.filter;
                    renderTimeline();
                });
            });

            // 搜索
            document.getElementById('search-input').addEventListener('input', (e) => {
                const keyword = e.target.value.toLowerCase().trim();
                if (!keyword) {
                    renderTimeline();
                    return;
                }

                const filtered = allDesigners.filter(d =>
                    d.name.toLowerCase().includes(keyword) ||
                    (d.notes && d.notes.toLowerCase().includes(keyword))
                );

                const container = document.getElementById('timeline');
                container.innerHTML = '';
                if (filtered.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                            <p>未找到匹配的设计师</p>
                        </div>`;
                    return;
                }
                container.appendChild(createWeekSection('搜索结果', filtered));
            });
        }

        init();
    </script>
</body>
