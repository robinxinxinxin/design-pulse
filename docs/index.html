<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f1419;
            --bg-secondary: #1a1f2e;
            --bg-card: #1e2530;
            --bg-card-hover: #252d3a;
            --bg-input: #1e2530;
            --text-primary: #e6e6e6;
            --text-secondary: #8b949e;
            --text-muted: #6b7280;
            --accent-cyan: #22d3ee;
            --accent-cyan-dark: #06b6d4;
            --accent-green: #22c55e;
            --accent-gold: #fbbf24;
            --accent-blue: #3b82f6;
            --accent-purple: #a855f7;
            --accent-pink: #ec4899;
            --accent-red: #ef4444;
            --accent-orange: #f97316;
            --border-color: rgba(255,255,255,0.06);
            --border-hover: rgba(255,255,255,0.1);
            --sidebar-w: 240px;
            --font-body: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --transition: 0.2s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
        :focus-visible { outline: 2px solid var(--accent-cyan); outline-offset: 2px; }
        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        /* ========== SIDEBAR ========== */
        .sidebar {
            position: fixed;
            left: 0; top: 0;
            width: var(--sidebar-w);
            height: 100vh;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 200;
            transition: transform 0.3s ease;
        }
        .sidebar-header {
            padding: 1.25rem 1.25rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            border-bottom: 1px solid var(--border-color);
        }
        .logo {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-cyan-dark));
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 13px;
            color: var(--bg-primary);
            flex-shrink: 0;
        }
        .sidebar-header h1 { font-size: 1.1rem; font-weight: 700; }
        .sidebar-header h1 span { display: block; font-size: 0.72rem; color: var(--text-muted); font-weight: 400; margin-top: 1px; }

        /* Nav */
        .sidebar-nav { padding: 0.75rem 0; flex: 1; overflow-y: auto; }
        .nav-section-title {
            padding: 0.5rem 1.25rem;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            padding: 0.55rem 1.25rem;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 0.88rem;
            font-weight: 500;
            transition: var(--transition);
            border-left: 3px solid transparent;
            text-decoration: none;
        }
        .nav-item:hover { color: var(--text-primary); background: rgba(255,255,255,0.03); }
        .nav-item.active {
            color: var(--accent-cyan);
            background: rgba(34, 211, 238, 0.06);
            border-left-color: var(--accent-cyan);
        }
        .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
        .nav-badge {
            margin-left: auto;
            background: rgba(34, 211, 238, 0.15);
            color: var(--accent-cyan);
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.1rem 0.45rem;
            border-radius: 10px;
        }

        /* Designer list in sidebar */
        .designer-list { padding: 0 0.5rem; }
        .designer-list-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 0.82rem;
        }
        .designer-list-item:hover { background: rgba(255,255,255,0.04); color: var(--text-primary); }
        .designer-list-avatar {
            width: 24px; height: 24px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 10px;
            color: var(--bg-primary);
            flex-shrink: 0;
        }
        .avatar-c0 { background: linear-gradient(135deg, #ff6b6b, #ee5a24); }
        .avatar-c1 { background: linear-gradient(135deg, #a29bfe, #6c5ce7); }
        .avatar-c2 { background: linear-gradient(135deg, #55efc4, #00b894); }
        .avatar-c3 { background: linear-gradient(135deg, #fdcb6e, #f39c12); }
        .avatar-c4 { background: linear-gradient(135deg, #74b9ff, #0984e3); }
        .avatar-c5 { background: linear-gradient(135deg, #fd79a8, #e84393); }
        .designer-list-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .platform-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .platform-dot.puxiang { background: var(--accent-green); }
        .platform-dot.behance { background: var(--accent-blue); }
        .platform-dot.zcool { background: var(--accent-red); }

        .sidebar-footer {
            padding: 1rem 1.25rem;
            border-top: 1px solid var(--border-color);
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .sidebar-footer .update-dot {
            display: inline-block;
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--accent-green);
            margin-right: 0.4rem;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* ========== MAIN CONTENT ========== */
        .main-content {
            margin-left: var(--sidebar-w);
            min-height: 100vh;
        }

        /* Top bar */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 20, 25, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            padding: 0.85rem 2rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .topbar-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        .topbar-count {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-left: 0.25rem;
        }
        .topbar-spacer { flex: 1; }
        .topbar-search {
            position: relative;
        }
        .topbar-search svg {
            position: absolute;
            left: 10px; top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }
        .topbar-search input {
            padding: 0.45rem 0.75rem 0.45rem 2rem;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.82rem;
            font-family: var(--font-body);
            outline: none;
            width: 220px;
            transition: var(--transition);
        }
        .topbar-search input::placeholder { color: var(--text-muted); }
        .topbar-search input:focus { border-color: var(--accent-cyan); box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.15); }

        /* Mobile menu button */
        .mobile-menu-btn {
            display: none;
            background: none; border: none;
            color: var(--text-primary);
            cursor: pointer;
            padding: 0.25rem;
        }
        .mobile-menu-btn svg { width: 22px; height: 22px; }

        /* ========== TIMELINE ========== */
        .content-area { padding: 1.5rem 2rem 3rem; }
        .timeline { position: relative; padding-left: 80px; }
        .timeline::before {
            content: '';
            position: absolute;
            left: 23px; top: 0; bottom: 0;
            width: 2px;
            background: var(--border-color);
        }

        /* Date group header */
        .date-group { margin-bottom: 2rem; }
        .date-label {
            position: absolute;
            left: -80px; top: 4px;
            width: 56px;
            text-align: right;
        }
        .date-label .dl-date { font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); }
        .date-label .dl-day { font-size: 0.68rem; color: var(--text-muted); }

        /* Timeline dot */
        .timeline-dot {
            position: absolute;
            left: -63px; top: 8px;
            width: 10px; height: 10px;
            border-radius: 50%;
            background: var(--border-hover);
            border: 2px solid var(--bg-primary);
        }
        .timeline-dot.new {
            background: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.2);
        }

        /* Card */
        .card {
            position: relative;
            background: var(--bg-card);
            border: 1px solid transparent;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
            transition: all 0.2s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .card:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-hover);
        }

        .card-image {
            width: 100%;
            height: 160px;
            background: var(--bg-input);
            border-radius: 8px;
            margin-bottom: 12px;
            overflow: hidden;
        }
        .card-image img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }
        .card:hover .card-image img { transform: scale(1.02); }

        .card-header {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            margin-bottom: 0.5rem;
        }
        .card-avatar {
            width: 32px; height: 32px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 12px;
            color: var(--bg-primary);
            flex-shrink: 0;
        }
        .card-author { font-size: 0.85rem; font-weight: 600; }
        .card-platform {
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: 500;
        }
        .platform-puxiang { background: rgba(34, 197, 94, 0.15); color: var(--accent-green); }
        .platform-behance { background: rgba(59, 130, 246, 0.15); color: var(--accent-blue); }
        .platform-zcool { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); }

        .card-title {
            font-size: 0.95rem;
            font-weight: 500;
            line-height: 1.5;
            margin-bottom: 0.35rem;
        }
        .card-desc {
            font-size: 0.82rem;
            color: var(--text-secondary);
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-footer {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-top: 0.65rem;
            padding-top: 0.65rem;
            border-top: 1px solid var(--border-color);
        }
        .card-type {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex; align-items: center; gap: 0.3rem;
        }
        .card-type svg { width: 14px; height: 14px; }
        .card-link {
            margin-left: auto;
            font-size: 0.8rem;
            color: var(--accent-cyan);
            display: flex; align-items: center; gap: 0.2rem;
        }
        .card:hover .card-link { color: #67e8f9; }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 5rem 2rem;
            color: var(--text-muted);
        }
        .empty-icon {
            width: 64px; height: 64px;
            margin: 0 auto 1.25rem;
            border-radius: 50%;
            background: var(--bg-card);
            display: flex; align-items: center; justify-content: center;
        }
        .empty-icon svg { width: 28px; height: 28px; opacity: 0.4; }
        .empty-state .empty-title { font-size: 1rem; font-weight: 500; margin-bottom: 0.4rem; }
        .empty-state .empty-desc { font-size: 0.82rem; }

        /* Footer stats */
        .footer-stats {
            display: flex;
            justify-content: center;
            gap: 3rem;
            padding: 2rem;
            border-top: 1px solid var(--border-color);
            margin-top: 2rem;
        }
        .footer-stat { text-align: center; }
        .footer-stat-num { font-size: 1.25rem; font-weight: 700; color: var(--accent-cyan); }
        .footer-stat-label { font-size: 0.72rem; color: var(--text-muted); margin-top: 0.15rem; }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 1024px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; }
            .mobile-menu-btn { display: block; }
            .sidebar-overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0,0,0,0.5);
                z-index: 150;
            }
            .sidebar-overlay.open { display: block; }
        }
        @media (max-width: 768px) {
            .content-area { padding: 1rem; }
            .topbar { padding: 0.75rem 1rem; }
            .topbar-search { width: 160px; }
            .timeline { padding-left: 60px; }
            .date-label { left: -60px; width: 42px; }
            .timeline-dot { left: -43px; }
            .card { padding: 14px 16px; }
            .card-image { height: 120px; }
            .footer-stats { gap: 1.5rem; }
        }
    </style>
</head>

                { name: "Anna Krupkin", profile_url: "https://www.behance.net/annakrupkin", notes: "插画家，1900好评，163关注者", platform: "behance" },
                { name: "Alexandru Negru", profile_url: "https://www.behance.net/alexandrunegru", notes: "3D产品可视化师，6096好评，804关注者", platform: "behance" },
                { name: "Oleksandr Honcharuk", profile_url: "https://www.behance.net/oleksandrhoncharuk", notes: "3D动画师，6362好评，612关注者", platform: "behance" },
                { name: "David Adebayo", profile_url: "https://www.behance.net/davidadebayo", notes: "产品设计师，1.4万好评，492关注者", platform: "behance" },
                { name: "Uladzimir Hermanovich", profile_url: "https://www.behance.net/uladzimirhermanovich", notes: "3D产品动画师，3193好评，661关注者", platform: "behance" },
                { name: "Sachin Zakarde", profile_url: "https://www.behance.net/sachinzakarde", notes: "工业设计师，Behance搜索推荐", platform: "behance" }
            ]
        };

        // 本周新作品（由自动化任务每周填充）
        const weeklyUpdates = [];

        // ==================== STATE ====================
        let allDesigners = [];
        let currentView = 'featured';

        // ==================== INIT ====================
        function init() {
            designersData.companies.forEach(d => allDesigners.push({ ...d, type: 'company' }));
            designersData.individuals.forEach(d => allDesigners.push({ ...d, type: 'individual' }));

            updateStats();
            renderSidebarDesigners();
            renderView();
            bindEvents();
        }

        // ==================== HELPERS ====================
        function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
        function getInitials(n) { return n.charAt(0).toUpperCase(); }
        function avatarClass(n) { return 'avatar-c' + (n.length % 6); }
        function platformName(p) { return { puxiang: '普象', behance: 'Behance', zcool: '站酷' }[p] || p; }
        function typeLabel(t) { return t === 'company' ? '设计公司' : '设计师'; }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
            return { date: `${d.getMonth()+1}月${d.getDate()}日`, day: weekdays[d.getDay()] };
        }

        // ==================== STATS ====================
        function updateStats() {
            const total = allDesigners.length;
            const puxiang = allDesigners.filter(d => d.platform === 'puxiang').length;
            const behance = allDesigners.filter(d => d.platform === 'behance').length;
            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-puxiang').textContent = puxiang;
            document.getElementById('stat-behance').textContent = behance;
            document.getElementById('stat-week').textContent = weeklyUpdates.length;
            document.getElementById('sidebar-count').textContent = total;
            const badge = document.getElementById('new-count-badge');
            if (weeklyUpdates.length > 0) { badge.textContent = weeklyUpdates.length; badge.style.display = ''; }
            else { badge.style.display = 'none'; }
        }

        // ==================== SIDEBAR ====================
        function renderSidebarDesigners() {
            const list = document.getElementById('designerList');
            list.innerHTML = '';
            allDesigners.forEach(d => {
                const a = document.createElement('a');
                a.className = 'designer-list-item';
                a.href = d.profile_url;
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                a.title = d.notes;
                a.innerHTML = `
                    <div class="designer-list-avatar ${avatarClass(d.name)}">${getInitials(d.name)}</div>
                    <span class="designer-list-name">${esc(d.name)}</span>
                    <span class="platform-dot ${d.platform}"></span>
                `;
                list.appendChild(a);
            });
        }

        // ==================== VIEWS ====================
        function renderView() {
            const main = document.getElementById('mainContent');
            const title = document.getElementById('topbar-title');
            const count = document.getElementById('topbar-count');

            if (currentView === 'featured') {
                title.textContent = '本周精选';
                count.textContent = weeklyUpdates.length > 0 ? `${weeklyUpdates.length} 条新作品` : '';
                renderFeatured(main);
            } else {
                title.textContent = '全部动态';
                count.textContent = `${weeklyUpdates.length} 条新作品`;
                renderAll(main);
            }
        }

        function renderFeatured(container) {
            if (weeklyUpdates.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
                        </div>
                        <div class="empty-title">本周暂无新作品</div>
                        <div class="empty-desc">每周一自动检查设计师更新，新作品将在这里展示</div>
                    </div>`;
                return;
            }
            renderTimeline(container, weeklyUpdates, true);
        }

        function renderAll(container) {
            if (weeklyUpdates.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
                        </div>
                        <div class="empty-title">本周暂无新作品</div>
                        <div class="empty-desc">每周一自动检查设计师更新，新作品将在这里展示</div>
                    </div>`;
                return;
            }
            renderTimeline(container, weeklyUpdates, false);
        }

        function renderTimeline(container, items, isFeatured) {
            // Group by date
            const groups = {};
            items.forEach(item => {
                const dateKey = item.date || new Date().toISOString().split('T')[0];
                if (!groups[dateKey]) groups[dateKey] = [];
                groups[dateKey].push(item);
            });

            const sortedDates = Object.keys(groups).sort((a, b) => new Date(b) - new Date(a));

            let html = '<div class="timeline">';
            sortedDates.forEach(dateKey => {
                const time = formatDate(dateKey);
                const groupItems = groups[dateKey];
                groupItems.forEach(item => {
                    html += `
                        <div class="date-group" style="position: relative;">
                            <div class="date-label">
                                <div class="dl-date">${time.date}</div>
                                <div class="dl-day">${time.day}</div>
                            </div>
                            <div class="timeline-dot ${isFeatured ? 'new' : ''}"></div>
                            <a href="${item.url || item.profile_url}" target="_blank" class="card">
                                ${item.cover_url ? `<div class="card-image"><img src="${esc(item.cover_url)}" alt="" loading="lazy" /></div>` : ''}
                                <div class="card-header">
                                    <div class="card-avatar ${avatarClass(item.author)}">${getInitials(item.author)}</div>
                                    <span class="card-author">${esc(item.author)}</span>
                                    <span class="card-platform platform-${item.platform}">${platformName(item.platform)}</span>
                                </div>
                                <div class="card-title">${esc(item.title)}</div>
                                <div class="card-desc">${esc(item.desc)}</div>
                                <div class="card-footer">
                                    <span class="card-type">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                                        ${typeLabel(item.author_type || 'individual')}
                                    </span>
                                    <span class="card-link">
                                        查看作品
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17L17 7M17 7H7M17 7V17"/></svg>
                                    </span>
                                </div>
                            </a>
                        </div>`;
                });
            });
            html += '</div>';
            container.innerHTML = html;
        }

        // ==================== EVENTS ====================
        function bindEvents() {
            // Nav items
            document.querySelectorAll('.nav-item[data-view]').forEach(item => {
                item.addEventListener('click', (e) => {
                    e.preventDefault();
                    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                    item.classList.add('active');
                    currentView = item.dataset.view;
                    renderView();
                    // Close mobile sidebar
                    document.getElementById('sidebar').classList.remove('open');
                    document.getElementById('sidebarOverlay').classList.remove('open');
                });
            });

            // Mobile menu
            document.getElementById('menuBtn').addEventListener('click', () => {
                document.getElementById('sidebar').classList.toggle('open');
                document.getElementById('sidebarOverlay').classList.toggle('open');
            });
            document.getElementById('sidebarOverlay').addEventListener('click', () => {
                document.getElementById('sidebar').classList.remove('open');
                document.getElementById('sidebarOverlay').classList.remove('open');
            });

            // Search
            document.getElementById('search-input').addEventListener('input', (e) => {
                const kw = e.target.value.toLowerCase().trim();
                if (!kw) { renderView(); return; }
                const filtered = weeklyUpdates.filter(i =>
                    i.title.toLowerCase().includes(kw) ||
                    i.author.toLowerCase().includes(kw) ||
                    i.desc.toLowerCase().includes(kw)
                );
                const main = document.getElementById('mainContent');
                if (filtered.length === 0) {
                    main.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                            </div>
                            <div class="empty-title">未找到匹配结果</div>
                            <div class="empty-desc">尝试其他关键词</div>
                        </div>`;
                    return;
                }
                renderTimeline(main, filtered, false);
            });
        }

        init();
    </script>
